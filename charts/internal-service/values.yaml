hub: "tigranham"
image: "nxlog-env-app"
tag: "latest"
prod: false

env: {}
# Example:
# env:
#   DEMO_ENV: "true"
#   SERVICE_NAME: "nxlog"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

affinity:
  podAntiAffinity:
    enabled: true

securityContext:
  enabled: true
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
